<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>慢跑时钟</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="titlebar">
        <div class="brand"><span class="brand-dot"></span>慢跑时钟</div>
        <div class="window-actions">
          <button id="pinButton" class="window-button active" aria-label="取消置顶" title="置顶">◆</button>
          <button id="minimizeButton" class="window-button" aria-label="最小化">−</button>
          <button id="closeButton" class="window-button close" aria-label="关闭">×</button>
        </div>
      </header>

      <section class="clock" aria-label="当前时间">
        <div id="clockTime" class="clock-time">00:00<span>:00</span></div>
        <div class="clock-meta">
          <span id="clockDate">正在获取日期</span>
          <span class="clock-message">一下、一下，慢慢来</span>
        </div>
      </section>

      <section class="scene" aria-label="像素角色按节拍顶砖块的动画">
        <div class="sky-stripes"></div>
        <div class="cloud-track cloud-track-back"><i></i><i></i><i></i></div>
        <div class="hill-track"><i></i><i></i><i></i><i></i></div>
        <div class="bush-track"><i></i><i></i><i></i><i></i><i></i></div>
        <div id="brickTrack" class="brick-track" aria-hidden="true"></div>
        <div id="spark" class="spark" aria-hidden="true">·</div>
        <canvas id="hero" width="144" height="168" aria-hidden="true"></canvas>
        <div class="grass-edge"></div>
        <div class="ground-track"></div>
      </section>

      <section class="status" aria-live="polite">
        <div>
          <span id="statusDot" class="status-dot"></span>
          <strong id="statusText">正在向前奔跑</strong>
        </div>
        <span id="beatCount" class="beat-count">000</span>
      </section>

    </main>
    <script src="renderer.js"></script>
  </body>
</html>
